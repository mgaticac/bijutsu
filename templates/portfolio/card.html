<article class="portfolio-card story-card"><a class="portfolio-photo" href="{{ work.get_absolute_url }}">{% if work.display_image %}<img src="{{ work.display_image.url }}" alt="{{ work.title }}" loading="lazy">{% endif %}<span aria-hidden="true">↗</span></a><div class="story-card-copy"><p class="eyebrow">{{ work.get_technology_display }} / {{ work.date|default:work.created_at|date:'d M Y' }}</p><h2><a href="{{ work.get_absolute_url }}">{{ work.title }}</a></h2>{% if work.description %}<p>{{ work.description|truncatewords:35 }}</p>{% endif %}<a class="text-link" href="{{ work.get_absolute_url }}">Leer la historia ↗</a></div></article>
